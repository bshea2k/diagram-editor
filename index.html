<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElysianMap</title>
    <link rel="icon" href="./logo--purple.svg">
    <link rel="stylesheet" href="./src/styles/style.css">
    <script type="module" src="./src/scripts/script.js"></script>
</head>
<body>
    <header class="doc-header">
        <div class="doc-header__top-left">
            <img class="doc-header__logo" src="./src/assets/logo--black.svg" alt="Black logo showing a feather with a subtle letter E in the shape">
            <div class="doc-header__info">
                <input type="text" class="doc-header__doc-title">
                <div class="util-bar">
                    <button class="util-bar__button" id="util-bar__button##file">file</button>
                    <button class="util-bar__button" id="util-bar__button##help">help</button>
                </div>
            </div>
        </div>
    </header>

    <div class="toolbar">
        <div class="toolbar__subsection">
            <select name="font" id="toolbar__dropdown##font" class="toolbar__dropdown">
                <option class="toolbar__dropdown-option" value="Arial">arial</option>
                <option class="toolbar__dropdown-option" value="Times New Roman">times new roman</option>
                <option class="toolbar__dropdown-option" value="Courier New">courier new</option>
            </select>
            <select name="font-size" id="toolbar__dropdown##font-size" class="toolbar__dropdown">
                <option class="toolbar__dropdown-option" value="10">10</option>
                <option class="toolbar__dropdown-option" value="16">16</option>
                <option class="toolbar__dropdown-option" value="26">26</option>
            </select>
            <button class="toolbar__button" id="toolbar__button--bold"><img src="./src/assets/bold-icon.svg" alt="Capital letter B" class="toolbar__button-icon"></button>
            <button class="toolbar__button" id="toolbar__button--italics"><img src="./src/assets/italics-icon.svg" alt="Italics letter I" class="toolbar__button-icon"></button>
            <button class="toolbar__button" id="toolbar__button--underline"><img src="./src/assets/underline-icon.svg" alt="Underlined letter U" class="toolbar__button-icon"></button>
            <button class="toolbar__button" id="toolbar__button--text-color"><img src="./src/assets/text-color-icon.svg" alt="Letter A with a thick black line under it" class="toolbar__button-icon"></button>
            <div class="toolbar__hover-dropdown" id="toolbar__dropdown--alignment">
                <button class="toolbar__button" id="toolbar__button--text-align"><img src="./src/assets/align-icon.svg" alt="Stacked lines" class="toolbar__button-icon"></button>
                <ul class="toolbar__hover-dropdown-options toolbar__hover-dropdown-options--vertical-alignment">
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--align-top"><img src="./src/assets/align-top-icon.svg" alt="Align top icon" class="toolbar__button-icon"></button></li>
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--align-center"><img src="./src/assets/align-center-icon.svg" alt="Align center icon" class="toolbar__button-icon"></button></li>
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--align-bottom"><img src="./src/assets/align-bottom-icon.svg" alt="Align bottom icon" class="toolbar__button-icon"></button></li>
                </ul>
            </div>
        </div>
        <div class="toolbar__subsection">
            <div class="toolbar__hover-dropdown" id="toolbar__dropdown--shape-color">
                <button class="toolbar__button" id="toolbar__button--shape-color"><div class="toolbar__color-circle"></div></button>
                <ul class="toolbar__hover-dropdown-options toolbar__hover-dropdown-options--horizontal-alignment">
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--shape-color-blue"><div class="toolbar__color-circle toolbar__color-circle--blue"></div></button></li>
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--shape-color-green"><div class="toolbar__color-circle toolbar__color-circle--green"></div></button></li>
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--shape-color-yellow"><div class="toolbar__color-circle toolbar__color-circle--yellow"></div></button></li>
                    <li class="toolbar__hover-dropdown-option"><button class="toolbar__button" id="toolbar__button--shape-color-red"><div class="toolbar__color-circle toolbar__color-circle--red"></div></button></li>
                </ul>
            </div>
            <button class="toolbar__button" id="toolbar__button--shape-border-color"><div class="toolbar__border-color-circle"></div></button>
            <select name="font-size" id="toolbar__dropdown##shape-border-width" class="toolbar__dropdown">
                <option class="toolbar__dropdown-option" value="1">1</option>
                <option class="toolbar__dropdown-option" value="2">2</option>
                <option class="toolbar__dropdown-option" value="4">4</option>
            </select>
        </div>
        <div class="toolbar__subsection">
            <select name="font-size" id="toolbar__dropdown##connection-width" class="toolbar__dropdown">
                <option class="toolbar__dropdown-option" value="1">1</option>
                <option class="toolbar__dropdown-option" value="2">2</option>
                <option class="toolbar__dropdown-option" value="4">4</option>
            </select>
        </div>
    </div>

    <div class="middle">
        <div class="shape-creation-menu">
            <h1 class="shape-creation-menu__title">shapes</h1>
            <div class="shape-creation-menu__shape-group">
                <h2 class="shape-creation-menu__shape-group-title">basic</h2>
                <div class="shape-creation-menu__shape-group-shapes">
                    <img src="./src/assets/square--black.svg" alt="Square with a black outline" class="shape-creation-menu__shape-icon" id="create__square">
                    <img src="./src/assets/circle--black.svg" alt="Circle with a black outline" class="shape-creation-menu__shape-icon" id="create__circle">
                </div>
            </div>
        </div>
        <canvas id="workspace" width="600" height="400"></canvas>
    </div>
</body>
</html>
